name: MisioFlix — build dla Jellyfin 12.4
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Instalacja parsera CSS do testow
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund postcss@8

      - name: Test plików frontendu
        run: |
          node --check src/Jellyfin.Plugin.MisioFlix/Web/client.js
          node --check src/Jellyfin.Plugin.MisioFlix/Web/home.js
          python3 -m unittest discover -s tests -p test_v0412.py -v
          python3 -m unittest discover -s tests -p test_home_0412.py -v
          python3 -m unittest discover -s tests -p test_drag_0413.py -v
          node tests/ui_v0411.cjs
      - name: Kompilacja DLL (bez kompilowania na NAS)
        run: dotnet publish src/Jellyfin.Plugin.MisioFlix/Jellyfin.Plugin.MisioFlix.csproj --configuration Release --output build/publish
      - name: Pakowanie
        id: pack
        run: python3 tools/package.py
      - name: Zachowaj paczkę ZIP z kompilacji
        uses: actions/upload-artifact@v4
        with:
          name: MisioFlix_${{ steps.pack.outputs.version }}_JF12.4
          path: ${{ steps.pack.outputs.archive }}
          if-no-files-found: error
